name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Go Vet
        run: go vet ./...

      - name: Unit & Race Tests with Coverage
        run: go test -race -cover -v ./...

      - name: Fuzz Smoke Tests
        run: |
          go test -fuzz=FuzzReadDescriptor -fuzztime=3s ./internal/asp
          go test -fuzz=FuzzExtractSample -fuzztime=3s ./internal/asp
          go test -fuzz=FuzzClassifyWithMin -fuzztime=3s ./internal/sound
          go test -fuzz=FuzzLoadEngine -fuzztime=3s ./internal/sound

      - name: Cross-Compile & Verify ARMv7 + ARM64 Assembly Kernels under QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go test -c -o sound-arm.test ./internal/sound
          qemu-arm ./sound-arm.test -test.v -test.run=TestDot4I8BoundaryAndTailLengths
          rm -f sound-arm.test
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o sound-arm64.test ./internal/sound
          qemu-aarch64 ./sound-arm64.test -test.v -test.run=TestDot4I8BoundaryAndTailLengths
          rm -f sound-arm64.test
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags nethttpomithttp2 -trimpath -ldflags="-s -w" -o techo5-sound-ai-linux-arm ./cmd/techo5-sound-ai
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags nethttpomithttp2 -trimpath -ldflags="-s -w" -o techo5-sound-ai-linux-arm64 ./cmd/techo5-sound-ai
          ls -lh techo5-sound-ai-linux-arm techo5-sound-ai-linux-arm64
