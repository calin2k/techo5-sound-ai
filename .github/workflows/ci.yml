name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Go Vet
        run: go vet ./...

      - name: Unit & Race Tests with Coverage
        run: go test -race -cover -v ./...

      - name: Fuzz Smoke Tests
        run: |
          go test -fuzz=FuzzReadDescriptor -fuzztime=3s ./internal/asp
          go test -fuzz=FuzzExtractSample -fuzztime=3s ./internal/asp
          go test -fuzz=FuzzClassifyWithMin -fuzztime=3s ./internal/sound

      - name: Cross-Compile ARMv7 Binary (TECHO5)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o techo5-sound-ai-linux-arm ./cmd/techo5-sound-ai
          ls -lh techo5-sound-ai-linux-arm
